<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SLO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/signup/styles.css">
</head>
<body>
    <div class="signup-container">
        <header class="signup-header">
            <h1 class="signup-title">Create Account</h1>
            <p class="signup-subtitle">Join your local knowledge vault</p>
        </header>

        <form id="signup-form" class="signup-form" novalidate>
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Choose a username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Create a password" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm-password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" class="form-input" placeholder="Confirm your password" required autocomplete="new-password">
            </div>

            <p id="signup-message" class="form-message" aria-live="polite"></p>
            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <footer class="signup-footer">
            <p>Already have an account? <a href="/login" class="signup-link">Sign In</a></p>
        </footer>
    </div>
    <script src="/static/signup/app.js"></script>
</body>
</html>
